<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contagem Regressiva & Fogos Realistas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #clock {
            font-size: 6.5rem;
            font-weight: 300;
            color: #f5f5f7;
            letter-spacing: 6px;
            z-index: 2;
            text-align: center;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            transition: opacity 0.5s ease;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="controls" id="controls-box">
        <button onclick="iniciarContagem()">▶ Tocar Animação</button>
    </div>

    <div class="screen">
        <canvas id="fireworks"></canvas>
        <div id="clock">23:59:50</div>
    </div>

    <script>
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let fireworks = [];
        let particles = [];
        let flashes = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Clarão na tela imitando o clarão real do rojão estourando
        class Flash {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = Math.random() * 150 + 100;
                this.alpha = 0.4;
                this.color = color;
            }
            update() {
                this.radius += 15;
                this.alpha -= 0.05;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Rojão subindo com rastro brilhante
        class Firework {
            constructor(startX, startY, targetX, targetY, color) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = color;
                this.speed = 6;
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 3;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
            }
            update() {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.vx *= 0.99;
                this.vy += 0.03; // Leve gravidade na subida
                this.x += this.vx;
                this.y += this.vy;
                this.distanceTraveled = Math.hypot(this.targetX - this.x, this.targetY - this.y);
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        }

        // Partícula da explosão com efeito cintilante e queda natural
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.friction = 0.96; // Resistência do ar
                this.gravity = 0.12;  // Puxão da gravidade
                this.decay = Math.random() * 0.015 + 0.007; // Tempo de vida
                this.coordinates = [];
                this.coordinateCount = 5;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
            }
            update() {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        function criarExplosao(x, y) {
            const paletas = [
                ['#ff3366', '#ff99cc', '#ffffff', '#ffcc00'],
                ['#00ffff', '#3399ff', '#ffffff', '#ff66ff'],
                ['#ffcc05', '#ff6600', '#ffffff', '#ff3333'],
                ['#9900ff', '#cc33ff', '#ffffff', '#00ffff']
            ];
            const cores = paletas[Math.floor(Math.random() * paletas.length)];
            
            // Cria o clarão inicial
            flashes.push(new Flash(x, y, cores[2]));

            // Cria centenas de faíscas espalhadas organicamente
            for (let i = 0; i < 120; i++) {
                particles.push(new Particle(x, y, cores[Math.floor(Math.random() * cores.length)]));
            }
        }

        function loop() {
            // Efeito de rastro cinematográfico no fundo preto
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            flashes.forEach((f, index) => {
                f.update();
                f.draw();
                if (f.alpha <= 0) flashes.splice(index, 1);
            });

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                // Distância pequena ou se começou a cair, explode
                if (Math.hypot(fw.targetX - fw.x, fw.targetY - fw.y) < 10 || fw.vy >= 0) {
                    criarExplosao(fw.x, fw.y);
                    fireworks.splice(index, 1);
                }
            });

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(loop);
        }
        loop();

        function iniciarContagem() {
            document.getElementById('controls-box').style.display = 'none';
            const clockEl = document.getElementById('clock');
            
            let horas = 23;
            let minutos = 59;
            let segundos = 50;

            const timerRelogio = setInterval(() => {
                segundos++;
                if (segundos > 59) {
                    segundos = 0;
                    minutos++;
                    if (minutos > 59) {
                        minutos = 0;
                        horas++;
                        if (horas > 23) {
                            horas = 0;
                        }
                    }
                }

                const h = String(horas).padStart(2, '0');
                const m = String(minutos).padStart(2, '0');
                const s = String(segundos).padStart(2, '0');
                
                clockEl.textContent = `${h}:${m}:${s}`;

                // Quando bater 00:00:00, desliga o relógio e inicia um show pirotécnico intenso
                if (horas === 0 && minutos === 0 && segundos === 0) {
                    clearInterval(timerRelogio);
                    clockEl.style.opacity = '0';
                    setTimeout(() => { clockEl.style.display = 'none'; }, 500);
                    
                    // Dispara vários fogos simultâneos de diferentes cantos com ritmo realista
                    setInterval(() => {
                        const startX = Math.random() * canvas.width;
                        const startY = canvas.height;
                        const targetX = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                        const targetY = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1);
                        
                        const paletas = ['#ff3366', '#00ffff', '#ffcc05', '#cc33ff', '#ffffff'];
                        fireworks.push(new Firework(startX, startY, targetX, targetY, paletas[Math.floor(Math.random() * paletas.length)]));
                    }, 250);
                }
            }, 1000);
        }
    </script>
</body>
</html>
